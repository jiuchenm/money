name: Deploy Nikki dashboard

on:
  push:
    branches: [main]
    paths:
      - 'nikki/**'
      - '.github/workflows/nikki-daily.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nikki-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nikki/site/package-lock.json
      - run: npm ci
        working-directory: nikki/site
      - run: npm run build
        working-directory: nikki/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nikki/site/dist
      - name: Deploy Nikki to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
